services:
  postgres:
    image: postgres:16-alpine
    container_name: mutesound-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mutesound}
      POSTGRES_USER: ${POSTGRES_USER:-mutesound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mutesound_dev_pass_123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mutesound-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mutesound} -d ${POSTGRES_DB:-mutesound}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mutesound-pgdata:
